openapi: 3.0.3

info:
  title: API de Almacenamiento de Transacciones
  description: >
    API responsable de almacenar las transacciones previamente
    procesadas y validadas por la API de Procesamiento de Transacciones.
    Genera una referencia única para cada transacción almacenada.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Ambiente local de desarrollo

tags:
  - name: Transacciones
    description: Operaciones relacionadas con el almacenamiento de transacciones

paths:

  /api/v1/transactions:

    post:
      tags:
        - Transacciones
      summary: Registrar una transacción
      description: >
        Recibe una transacción previamente validada, genera una referencia
        única y almacena la información de la transacción en la base de datos.

      operationId: crearTransaccion

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              operacion: venta
              importe: 100.00
              cliente: Angelito
              estatus: APROBADA

      responses:

        '201':
          description: Transacción registrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              example:
                id: 1
                operacion: venta
                importe: 100.00
                cliente: Angelito
                referencia: "760a5278-83d6-42fb-b02c-8c94a64be572"
                estatus: APROBADA

        '400':
          description: Datos de la solicitud inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: 400
                error: Solicitud incorrecta
                mensaje: Los datos de la transacción no son válidos

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                codigo: 500
                error: Error interno del servidor
                mensaje: Ocurrió un error inesperado


components:

  schemas:

    TransactionRequest:
      type: object
      required:
        - operacion
        - importe
        - cliente
        - estatus

      properties:

        operacion:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^[A-Za-zÁÉÍÓÚáéíóúÑñ ]+$'
          description: Tipo de operación realizada
          example: venta

        importe:
          type: number
          format: double
          minimum: 0.01
          description: Importe monetario de la transacción
          example: 100.00

        cliente:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-zÁÉÍÓÚáéíóúÑñ ]+$'
          description: Nombre del cliente
          example: Angelito

        estatus:
          type: string
          description: Resultado del procesamiento realizado por API1
          enum:
            - APROBADA
            - CANCELADA
          example: APROBADA


    TransactionResponse:
      type: object
      required:
        - id
        - operacion
        - importe
        - cliente
        - referencia
        - estatus

      properties:

        id:
          type: integer
          format: int64
          description: Identificador interno de la transacción
          example: 1

        operacion:
          type: string
          description: Tipo de operación realizada
          example: venta

        importe:
          type: number
          format: double
          description: Importe de la transacción
          example: 100.00

        cliente:
          type: string
          description: Nombre del cliente
          example: Angelito

        referencia:
          type: string
          format: uuid
          description: Referencia única generada para la transacción
          example: "760a5278-83d6-42fb-b02c-8c94a64be572"

        estatus:
          type: string
          description: Estado final de la transacción
          enum:
            - APROBADA
            - CANCELADA
          example: APROBADA


    ErrorResponse:
      type: object
      required:
        - codigo
        - error
        - mensaje

      properties:

        codigo:
          type: integer
          format: int32
          description: Código HTTP asociado al error
          example: 400

        error:
          type: string
          description: Tipo de error producido
          example: Solicitud incorrecta

        mensaje:
          type: string
          description: Descripción del error
          example: Los datos de la transacción no son válidos